[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unjess"
version = "0.1.0"
description = "A full-featured AI coding agent — like Cursor/Aider/Claude Code, but yours."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
    "google-genai>=1.0",
    "httpx>=0.25",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5",
    "nest_asyncio>=1.5",
    "nicegui>=2.0",
    "pywebview>=5.0",
    "uvicorn>=0.30,<0.34",  # 0.34+ breaks NiceGUI's asyncio.run patch (loop_factory kwarg)
]

[project.optional-dependencies]
api = ["aiohttp>=3.9"]
browser = ["playwright>=1.40"]
vision = ["Pillow>=10.0"]
package = ["pyinstaller>=6.0"]
all = ["aiohttp>=3.9", "playwright>=1.40", "Pillow>=10.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-timeout>=2.3"]

[project.scripts]
njss = "unjess.cli:main"
njss-gui = "unjess.cli:gui_main"

[project.gui-scripts]
njss-app = "unjess.cli:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-v --tb=short"
